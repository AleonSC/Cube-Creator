// Add this component to the root of an imported Cube Creator model and assign
// CubeCreatorConfig.json. It recreates the idle animation, glow pulse, texture
// scrolling, particle layers and the click "squash + burst" feedback.
using System;
using System.Collections.Generic;
using UnityEngine;
using UnityEngine.Events;
#if ENABLE_INPUT_SYSTEM && !ENABLE_LEGACY_INPUT_MANAGER
using UnityEngine.InputSystem;
#endif

namespace CubeCreator
{
    [Serializable] public class ClickEvent : UnityEvent<int> { }

    [DisallowMultipleComponent]
    public class CubeCreatorCube : MonoBehaviour
    {
        [Tooltip("CubeCreatorConfig.json exported with the model")]
        public TextAsset config;
        public bool animate = true;
        public bool buildParticles = true;
        public bool applyGlow = true;
        [Tooltip("Adds a BoxCollider and reacts to mouse clicks / taps (old or new Input System).")]
        public bool clickable = true;
        public ClickEvent onClicked = new ClickEvent();
        public int clicks;

        public static event Action<CubeCreatorCube> AnyCubeClicked;

        const float TAU = Mathf.PI * 2f;
        static readonly string[] EmissionProps = { "_EmissionColor", "emissiveFactor" };
        static readonly string[] TextureProps = { "_BaseMap", "_MainTex", "baseColorTexture", "_EmissionMap", "emissiveTexture", "_BumpMap", "normalTexture" };

        CubeConfig cfg;
        Transform pivot, spinner;
        Vector3 pivotPos, pivotScale;
        Quaternion spinnerRot;
        float angleX, angleY, time, squashX, squashV;
        ParticleSystem burst;
        readonly List<(Material mat, string prop, Color baseColor)> glow = new List<(Material, string, Color)>();
        readonly List<Material> scrollMats = new List<Material>();

        void Awake()
        {
            if (config == null)
            {
                Debug.LogWarning("[CubeCreator] No config assigned on " + name, this);
                return;
            }
            cfg = JsonUtility.FromJson<CubeConfig>(config.text);
            pivot = FindDeep(transform, "Pivot");
            if (pivot == null) pivot = transform;
            spinner = FindDeep(transform, "CubeMesh");
            if (spinner == null) spinner = pivot;
            pivotPos = pivot.localPosition;
            pivotScale = pivot.localScale;
            spinnerRot = spinner.localRotation;

            CollectMaterials();
            if (buildParticles) BuildParticles();
            if (clickable && GetComponent<Collider>() == null) AddCollider();
        }

        void CollectMaterials()
        {
            Color glowColor = ColorUtil.Parse(cfg.glow != null ? cfg.glow.color : null, Color.black);
            float glowIntensity = cfg.glow != null ? cfg.glow.intensity : 0f;
            foreach (var r in GetComponentsInChildren<Renderer>())
            {
                if (r is ParticleSystemRenderer) continue;
                foreach (var m in r.materials)
                {
                    foreach (var prop in EmissionProps)
                    {
                        if (!m.HasProperty(prop)) continue;
                        Color c = m.GetColor(prop);
                        // OBJ / non-glTF imports lose emission: restore it from the config
                        if (applyGlow && c.maxColorComponent < 0.001f && glowIntensity > 0f && m.name.Contains("CubeSurface"))
                        {
                            c = glowColor * glowIntensity;
                            m.SetColor(prop, c);
                            m.EnableKeyword("_EMISSION");
                            m.globalIlluminationFlags = MaterialGlobalIlluminationFlags.RealtimeEmissive;
                        }
                        glow.Add((m, prop, c));
                    }
                    scrollMats.Add(m);
                }
            }
        }

        void BuildParticles()
        {
            if (cfg.particles != null)
                foreach (var layer in cfg.particles)
                    CubeCreatorParticles.Build(layer, pivot, cfg.bounds, false);
            if (cfg.clicker != null && cfg.clicker.hasBurst && cfg.clicker.burst != null)
                burst = CubeCreatorParticles.Build(cfg.clicker.burst, pivot, cfg.bounds, true);
        }

        void AddCollider()
        {
            var renderers = GetComponentsInChildren<MeshRenderer>();
            if (renderers.Length == 0) return;
            Bounds b = renderers[0].bounds;
            foreach (var r in renderers) b.Encapsulate(r.bounds);
            var box = gameObject.AddComponent<BoxCollider>();
            box.center = transform.InverseTransformPoint(b.center);
            Vector3 s = transform.lossyScale;
            box.size = new Vector3(b.size.x / Mathf.Max(1e-5f, s.x), b.size.y / Mathf.Max(1e-5f, s.y), b.size.z / Mathf.Max(1e-5f, s.z));
        }

        void OnMouseDown()
        {
            if (clickable) Click();
        }

        /// Trigger the click feedback (squash, particle burst, events).
        public void Click()
        {
            clicks++;
            if (cfg != null && cfg.clicker != null && cfg.clicker.enabled)
            {
                squashV -= 30f * cfg.clicker.squash;
                if (burst != null)
                {
                    if (!burst.isPlaying) burst.Play();
                    burst.Emit(Mathf.Max(1, cfg.clicker.burstCount));
                }
            }
            onClicked.Invoke(clicks);
            AnyCubeClicked?.Invoke(this);
        }

        void Update()
        {
            PollPointer();
            if (cfg == null || cfg.animation == null || !animate) return;
            var a = cfg.animation;
            float dt = Time.deltaTime;
            time += dt;

            angleX += a.spinX * 90f * dt;
            angleY += a.spinY * 90f * dt;
            float wobble = a.wobble * 0.25f * Mathf.Sin(time * 1.7f) * Mathf.Rad2Deg;
            spinner.localRotation = spinnerRot * Quaternion.Euler(angleX, angleY, wobble);

            squashV += (-squashX * 260f - squashV * 14f) * dt;
            squashX += squashV * dt;
            float pulse = 1f + a.pulseScale * 0.5f * Mathf.Sin(time * a.pulseSpeed * TAU);
            float sx = pulse * (1f - squashX * 0.5f);
            float sy = pulse * (1f + squashX);
            pivot.localScale = Vector3.Scale(pivotScale, new Vector3(sx, sy, sx));
            pivot.localPosition = pivotPos + Vector3.up * (a.bobAmplitude * Mathf.Sin(time * a.bobSpeed * TAU));

            float k = 1f;
            if (a.glowPulse > 0f) k *= 1f - a.glowPulse * 0.5f + a.glowPulse * 0.5f * Mathf.Sin(time * a.glowPulseSpeed * TAU);
            if (a.flicker > 0f) k *= 1f - a.flicker * 0.5f * (Mathf.Sin(time * 23.1f) * Mathf.Sin(time * 13.7f) * 0.5f + 0.5f + UnityEngine.Random.value * 0.3f);
            if (a.glowPulse > 0f || a.flicker > 0f)
                foreach (var g in glow) g.mat.SetColor(g.prop, g.baseColor * k);

            if (a.scrollU != 0f || a.scrollV != 0f)
            {
                var offset = new Vector2(Mathf.Repeat(time * a.scrollU, 1f), Mathf.Repeat(time * a.scrollV, 1f));
                foreach (var m in scrollMats)
                    foreach (var prop in TextureProps)
                        if (m.HasProperty(prop)) m.SetTextureOffset(prop, offset);
            }
        }

        // OnMouseDown only works with the old Input Manager. When a project uses the
        // new Input System exclusively, raycast clicks / taps ourselves.
        void PollPointer()
        {
#if ENABLE_INPUT_SYSTEM && !ENABLE_LEGACY_INPUT_MANAGER
            if (!clickable) return;
            Vector2 pos;
            if (Mouse.current != null && Mouse.current.leftButton.wasPressedThisFrame) pos = Mouse.current.position.ReadValue();
            else if (Touchscreen.current != null && Touchscreen.current.primaryTouch.press.wasPressedThisFrame) pos = Touchscreen.current.primaryTouch.position.ReadValue();
            else return;
            var cam = Camera.main;
            if (cam == null) return;
            if (Physics.Raycast(cam.ScreenPointToRay(pos), out var hit) && hit.collider.transform.IsChildOf(transform)) Click();
#endif
        }

        static Transform FindDeep(Transform t, string n)
        {
            if (t.name == n) return t;
            foreach (Transform c in t)
            {
                var r = FindDeep(c, n);
                if (r != null) return r;
            }
            return null;
        }
    }
}

using UnityEngine;
using UnityEngine.Rendering;

namespace CubeCreator
{
    public static class CubeCreatorParticles
    {
        static readonly Dictionary<string, Texture2D> SpriteCache = new Dictionary<string, Texture2D>();

        public static ParticleSystem Build(ParticleLayer p, Transform parent, Vector3 half, bool burstOnly)
        {
            var go = new GameObject((burstOnly ? "ClickBurst_" : "Particles_") + p.name);
            go.transform.SetParent(parent, false);

            float speedMin = p.speed * (1f - p.speedVar);
            float speedMax = p.speed;

            var main = ps.main;

            main.playOnAwake = true;
            main.duration = 5f;
            main.startLifetime = new ParticleSystem.MinMaxCurve(Mathf.Max(0.05f, p.lifetime * (1f - p.lifetimeVar)), p.lifetime);
            main.startSize = new ParticleSystem.MinMaxCurve(p.size * 0.6f, p.size * 1.4f);
            main.gravityModifier = p.gravity / 9.81f;
            main.simulationSpace = ParticleSystemSimulationSpace.Local;
            main.scalingMode = ParticleSystemScalingMode.Hierarchy;
            main.maxParticles = burstOnly ? 1000 : Mathf.Clamp(Mathf.CeilToInt(p.rate * p.lifetime * 1.3f) + 64, 64, 10000);

            if (p.colorMode == "randomHue")
            {
                var rainbow = new Gradient();
                rainbow.SetKeys(
                    new[] { new GradientColorKey(Color.red, 0f), new GradientColorKey(Color.yellow, 0.2f), new GradientColorKey(Color.green, 0.4f), new GradientColorKey(Color.cyan, 0.6f), new GradientColorKey(Color.blue, 0.8f), new GradientColorKey(Color.magenta, 1f) },
                    new[] { new GradientAlphaKey(1f, 0f), new GradientAlphaKey(1f, 1f) });
                main.startColor = new ParticleSystem.MinMaxGradient(rainbow) { mode = ParticleSystemGradientMode.RandomColor };
            }

                limit.enabled = true;
                limit.limit = 1000f;
                limit.drag = p.drag;

            {

                noise.enabled = true;
                noise.strength = p.turbulence * 0.25f;
                noise.frequency = 1.5f;
                noise.scrollSpeed = 0.5f;

                case "random":

        static Material MakeMaterial(ParticleLayer p)
        {

                m.SetFloat("_Surface", 1f);
                m.SetFloat("_Blend", additive ? 2f : 0f);
                m.SetFloat("_SrcBlend", (float)BlendMode.SrcAlpha);
                m.SetFloat("_DstBlend", additive ? (float)BlendMode.One : (float)BlendMode.OneMinusSrcAlpha);
                m.SetFloat("_ZWrite", 0f);
                m.EnableKeyword("_SURFACE_TYPE_TRANSPARENT");
                m.renderQueue = (int)RenderQueue.Transparent;
                m.SetTexture("_BaseMap", tex);
                m.SetColor("_BaseColor", tint);
                return m;
            }
            Shader legacy = Shader.Find(additive ? "Legacy Shaders/Particles/Additive" : "Legacy Shaders/Particles/Alpha Blended");
            if (legacy != null)
            {
                var m = new Material(legacy);
                m.SetTexture("_MainTex", tex);
                m.SetColor("_TintColor", new Color(0.5f, 0.5f, 0.5f, 0.5f) * Mathf.Min(2f, p.brightness));
                return m;
            }
            var fallback = new Material(Shader.Find("Sprites/Default"));
            fallback.mainTexture = tex;
            return fallback;
        }

        static Texture2D LoadSprite(string id)
        {

            if (SpriteCache.TryGetValue(id, out var cached) && cached != null) return cached;

        static Texture2D SoftDot()

                    t.SetPixel(x, y, new Color(1f, 1f, 1f, a * a));

            return t;

## Import
1. **Install glTFast** once per project: Package Manager → \`+\` → *Add package by name* →
   \`com.unity.cloud.gltfast\`. If it shows compile errors, pick an older version in its
   *Version History* tab — or skip glTFast entirely: the OBJ copy of each cube is used
   instead (glow still works; glass/transparency must be set by hand).
2. **Import the cube:** double-click the \`.unitypackage\` (or *Assets → Import Package →
   Custom Package…*) and click **Import**. Every cube shares one copy of the scripts in
   \`Assets/CubeCreator/Scripts\`; each cube gets its own folder in \`Assets/CubeCreator/Cubes\`.
   Importing more cubes later just updates the shared scripts — no duplicates.
   (Zip export instead? Extract it into your project folder — the one that contains
   \`Assets\` — and let it merge/replace files.)
3. **Cube Creator → Set Up Cube** (top menu). With several cubes, first select the one you
   want (its \`.glb\` in the Project window, or the model in your scene). It adds the cube to
   the scene, attaches **CubeCreatorCube** with its config and, in URP, adds a Bloom volume.
4. Press **Play** and click the cube.

Manual alternative: drag \`Cubes/CubeCreator_<name>/Models/<name>.glb\` into the scene, add
the **CubeCreatorCube** component to its top object and assign its
\`CubeCreatorConfig_<name>.json\` to **Config**.

## Clicker hooks
- \`onClicked (int clicks)\` UnityEvent in the inspector.
- \`CubeCreatorCube.AnyCubeClicked\` static C# event.
- Call \`cube.Click()\` to trigger it from your own code. Mouse clicks and taps already
  work with both the old Input Manager and the new Input System.

## Notes
- Works with URP (uses *Universal Render Pipeline/Particles/Unlit*) and the Built-in
  pipeline (legacy particle shaders). If particles render pink in a player build, add
  the shader to *Project Settings → Graphics → Always Included Shaders*.
- Glow needs **Bloom** (Set Up Cube adds it in URP; threshold ~0.9).
- Particle settings approximate the web preview using Unity's ParticleSystem modules —
  tweak the generated \`Particles_*\` children freely.
- Upgrading from an older Cube Creator export that had a \`Scripts\` folder inside each
  cube folder? Delete those per-cube \`Scripts\` folders, then import this package.
